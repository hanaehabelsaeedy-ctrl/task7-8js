<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coffee order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
         <h1>Coffe Order</h1>
     <form id ="orderForm">
        <label for="name">Name:</label>
        <input type="text" id="name">
        <small id="nameerror"></small>

        <br>
        <br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone">
        <small id="phoneerror"></small>

        <br>
        <br>

        <label for="product">Product</label>
        <select id="product">
            <option value="">Select a product</option>
            <option value="Espresso">Espresso — 45 EGP </option>
            <option value="Latte"> Latte — 65 EGP</option>
            <option value="Croissant">Croissant — 40 EGP  </option>
        </select>
         <small id="producterror"></small>

        <br>
        <br>

        <label for="quintity">Quintity</label>
        <input type="number" id="quantity">
         <small id="quintityerror"></small>

        <br>
        <br>

        <button type="submit">Order</button>
        </form>
        <div id="orderresult"></div>









    

     <script src="./app1.js"></script>
</body>
</html>
